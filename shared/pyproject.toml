[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "lol-portfolio-core"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
portfolio_core = ["static/*", "migrations/*.py", "migrations/versions/*.py"]
