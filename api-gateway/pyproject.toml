[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "lol-api-gateway"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["lol-portfolio-core==0.2.0", "uvicorn>=0.30,<1", "PyJWT>=2.10,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
gateway = ["static/*", "migrations/*.py", "migrations/versions/*.py"]
